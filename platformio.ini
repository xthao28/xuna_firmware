[platformio]
default_envs = xuna_t_display_s3
; Local, uncommitted E14 settings (Wi-Fi, dev server): copy e14_local.ini.example.
extra_configs = e14_local.ini

[env]
extra_scripts = pre:tools/check_core_purity.py

[env:xuna_t_display_s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
; Explicit vendor-equivalent memory configuration, not generic DevKit defaults.
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps = bodmer/TFT_eSPI@2.5.43
build_src_filter = +<*> -<parity/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED=1
    -DXUNA_HID=1
    -I "${platformio.libdeps_dir}/xuna_t_display_s3/TFT_eSPI"
    -include User_Setups/Setup206_LilyGo_T_Display_S3.h

; S21 target parity: replays sim/traces on the board with an in-RAM store,
; prints snapshot hashes and step() timing, then halts. No BLE/display/NVS.
[env:xuna_parity]
extends = env:xuna_t_display_s3
lib_deps =
build_src_filter = -<*> +<parity/>
extra_scripts =
    pre:tools/check_core_purity.py
    pre:tools/embed_parity_traces.py

; E14 gate (DC-1, docs/roadmap/cloud/E14-runbook.md). The baseline is the normal
; firmware plus the e14 metric lines; xuna_e14 adds the Wi-Fi + TLS + WebSocket
; echo task on core 0. Wi-Fi and server come from [e14_local] in e14_local.ini.
[e14_local]
build_flags =

[env:xuna_e14_baseline]
extends = env:xuna_t_display_s3
; The board JSON pins Arduino's event task to core 1, next to the life loop.
build_unflags = -DARDUINO_EVENT_RUNNING_CORE=1
build_flags = ${env:xuna_t_display_s3.build_flags} -DXUNA_E14=0 -DARDUINO_EVENT_RUNNING_CORE=0

[env:xuna_e14]
extends = env:xuna_t_display_s3
build_unflags = -DARDUINO_EVENT_RUNNING_CORE=1
build_flags = ${env:xuna_t_display_s3.build_flags} -DXUNA_E14=1 -DARDUINO_EVENT_RUNNING_CORE=0
    ${e14_local.build_flags}

; Device-direct cloud connection (DC-2…DC-5, ADR-0010), off by default until
; the E14 gate passes: Wi-Fi set up from the app over BLE (7a6e0011/0012).
[env:xuna_net]
extends = env:xuna_t_display_s3
build_unflags = -DARDUINO_EVENT_RUNNING_CORE=1
build_flags = ${env:xuna_t_display_s3.build_flags} -DXUNA_NET=1 -DARDUINO_EVENT_RUNNING_CORE=0

; BLE HID Consumer Control PoC / alias (UDC-1/UDC-2).
[env:xuna_hid]
extends = env:xuna_t_display_s3
build_flags = ${env:xuna_t_display_s3.build_flags} -DXUNA_HID=1

[env:xuna_hid_net]
extends = env:xuna_net
build_flags = ${env:xuna_net.build_flags} -DXUNA_HID=1

; Experimental Apple Media Service (AMS) GATT client build (UDC-6 S6.3).
; Off by default in xuna_t_display_s3 until board validation.
[env:xuna_ams]
extends = env:xuna_t_display_s3
build_flags = ${env:xuna_t_display_s3.build_flags} -DXUNA_HID=1 -DXUNA_AMS=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror -Ilib/xuna_core/include

[env:native_asan]
extends = env:native
build_flags = ${env:native.build_flags} -fsanitize=address,undefined -fno-omit-frame-pointer
