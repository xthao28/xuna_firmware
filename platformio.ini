[platformio]
default_envs = xuna_t_display_s3

[env]
extra_scripts = pre:tools/check_core_purity.py

[env:xuna_t_display_s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
; Explicit vendor-equivalent memory configuration, not generic DevKit defaults.
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED=1
    -I "${platformio.libdeps_dir}/xuna_t_display_s3/TFT_eSPI"
    -include User_Setups/Setup206_LilyGo_T_Display_S3.h

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror -Ilib/xuna_core/include

[env:native_asan]
extends = env:native
build_flags = ${env:native.build_flags} -fsanitize=address,undefined -fno-omit-frame-pointer
